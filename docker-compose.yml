version: '3.8'

services: 
  db: 
    image: posgres:latest
    container_name: postrgre-db
    environment: 
      POSTGRES_DB: social
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - db-data/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.b
    ports:
      - "5432:5432"

volumes:
  db-data: 